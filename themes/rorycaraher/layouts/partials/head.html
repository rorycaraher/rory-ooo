{{- $title := site.Title }}
{{- if not .IsHome }}{{ $title = printf "%s | %s" .Title site.Title }}{{ end }}
{{- $description := or .Description (.Summary | plainify) site.Title }}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}">

<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $description }}">

<link rel="alternate" type="application/rss+xml" href="{{ "/index.xml" | absURL }}" title="{{ site.Title }}">

<link rel="preload" href="/fonts/roboto-light-latin.woff2" as="font" type="font/woff2" crossorigin>

{{ partialCached "head/css.html" . }}
